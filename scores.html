<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scores · Minimax Arcade</title>
<link rel="stylesheet" href="style.css">
<style>
  .big-scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 50px;
  }
  .big-scores .panel { text-align: center; padding: 26px 0; }
  .big-scores .num { font-family: 'Space Grotesk', sans-serif; font-size: 44px; }
  .big-scores .lbl { font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-top: 8px; }
  .cyan-text { color: var(--cyan); }
  .magenta-text { color: var(--magenta); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 400; }
  .result-win { color: var(--cyan); }
  .result-loss { color: var(--magenta); }
  .result-draw { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<nav class="nav">
  <div class="brand">MINIMAX<span>ARCADE</span></div>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="game.html">Play</a>
    <a href="scores.html" class="active">Scores</a>
  </div>
  <div class="player" id="navPlayer"></div>
</nav>

<div class="page">
  <div class="eyebrow">// scoreboard</div>
  <h1 style="margin-bottom:30px;">Track record vs. the machine</h1>

  <div class="big-scores">
    <div class="panel"><div class="num cyan-text" id="totalYou">0</div><div class="lbl">Player Wins</div></div>
    <div class="panel"><div class="num magenta-text" id="totalAI">0</div><div class="lbl">AI Wins</div></div>
    <div class="panel"><div class="num" id="totalDraw">0</div><div class="lbl">Draws</div></div>
  </div>

  <div class="eyebrow">// match history</div>
  <div class="panel">
    <table>
      <thead>
        <tr><th>Player</th><th>Result</th><th>Time</th></tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">No matches played yet. <a href="game.html" style="color:var(--cyan)">Play your first round →</a></div>
  </div>

  <div style="margin-top:24px;">
    <button class="btn ghost" onclick="clearAll()">Reset All Scores</button>
  </div>
</div>

<script src="script.js"></script>
<script>
renderNavPlayer();

function render() {
  const s = getScores();
  document.getElementById('totalYou').textContent = s.you;
  document.getElementById('totalAI').textContent = s.ai;
  document.getElementById('totalDraw').textContent = s.draw;

  const h = getHistory();
  const body = document.getElementById('historyBody');
  body.innerHTML = '';
  document.getElementById('emptyMsg').style.display = h.length ? 'none' : 'block';

  h.forEach(entry => {
    const tr = document.createElement('tr');
    const label = entry.result === 'win' ? 'You won' : entry.result === 'loss' ? 'AI won' : 'Draw';
    tr.innerHTML = `<td>${entry.player}</td><td class="result-${entry.result}">${label}</td><td class="muted">${entry.time}</td>`;
    body.appendChild(tr);
  });
}

function clearAll() {
  if (confirm('Reset all scores and match history?')) {
    resetAll();
    render();
  }
}

render();
</script>
</body>
</html>
