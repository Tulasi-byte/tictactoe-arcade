<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Play · Minimax Arcade</title>
<link rel="stylesheet" href="style.css">
<style>
  .game-wrap {
    display: flex;
    gap: 50px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  #status {
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 18px;
    color: var(--muted);
    height: 18px;
  }
  #status.win { color: var(--cyan); }
  #status.lose { color: var(--magenta); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 96px);
    grid-template-rows: repeat(3, 96px);
    gap: 3px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .cell {
    background: var(--panel-2);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s ease;
  }
  .cell:hover:not(.taken) { background: #1d2440; }
  .cell.x { color: var(--magenta); }
  .cell.o { color: var(--cyan); }
  .cell.taken { cursor: default; }
  .cell.winning { background: rgba(77,232,240,0.15); }

  .side { min-width: 220px; }
  .score-mini { display: flex; gap: 20px; margin-bottom: 24px; }
  .score-mini div { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .score-mini span { display: block; font-family: 'Space Grotesk',sans-serif; font-size: 26px; color: var(--text); }
  .btn.small { padding: 10px 18px; font-size: 11px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="brand">MINIMAX<span>ARCADE</span></div>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="game.html" class="active">Play</a>
    <a href="scores.html">Scores</a>
  </div>
  <div class="player" id="navPlayer"></div>
</nav>

<div class="page">
  <div class="eyebrow">// live match</div>
  <h1 style="margin-bottom:8px;">You are <span style="color:var(--cyan)">O</span>. The AI is <span style="color:var(--magenta)">X</span>.</h1>
  <div id="status">your move</div>

  <div class="game-wrap">
    <div class="board" id="board"></div>

    <div class="side">
      <div class="score-mini">
        <div>YOU<span id="sYou">0</span></div>
        <div>AI<span id="sAI">0</span></div>
        <div>DRAW<span id="sDraw">0</span></div>
      </div>
      <button class="btn small" onclick="newGame()">New Round</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
renderNavPlayer();
const player = requirePlayer();

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
let board, gameOver;

function refreshScoreUI() {
  const s = getScores();
  document.getElementById('sYou').textContent = s.you;
  document.getElementById('sAI').textContent = s.ai;
  document.getElementById('sDraw').textContent = s.draw;
}

function newGame() {
  board = Array(9).fill(null);
  gameOver = false;
  statusEl.textContent = 'your move';
  statusEl.className = '';
  render();
}

function render() {
  boardEl.innerHTML = '';
  const w = getWinner(board);
  board.forEach((val, i) => {
    const c = document.createElement('div');
    c.className = 'cell' + (val ? ' taken ' + val.toLowerCase() : '');
    if (w && w.line.includes(i)) c.classList.add('winning');
    c.textContent = val || '';
    c.onclick = () => handleMove(i);
    boardEl.appendChild(c);
  });
}

function handleMove(i) {
  if (gameOver || board[i]) return;
  board[i] = 'O';
  render();
  if (checkEnd()) return;

  statusEl.textContent = 'ai thinking...';
  setTimeout(() => {
    const move = bestMove(board);
    board[move] = 'X';
    render();
    checkEnd();
  }, 300);
}

function checkEnd() {
  const w = getWinner(board);
  const s = getScores();
  if (w) {
    gameOver = true;
    if (w.player === 'O') {
      statusEl.textContent = 'you win!';
      statusEl.className = 'win';
      s.you++;
      pushHistory({ player, result: 'win', time: new Date().toLocaleString() });
    } else {
      statusEl.textContent = 'ai wins.';
      statusEl.className = 'lose';
      s.ai++;
      pushHistory({ player, result: 'loss', time: new Date().toLocaleString() });
    }
    saveScores(s);
    refreshScoreUI();
    return true;
  }
  if (board.every(c => c)) {
    gameOver = true;
    statusEl.textContent = 'draw.';
    s.draw++;
    saveScores(s);
    pushHistory({ player, result: 'draw', time: new Date().toLocaleString() });
    refreshScoreUI();
    return true;
  }
  statusEl.textContent = 'your move';
  return false;
}

refreshScoreUI();
newGame();
</script>
</body>
</html>
